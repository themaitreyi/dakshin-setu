services:
  web:
    build: .
    environment:
      POLAR_API_URL: http://api:4000
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      STORAGE_DIR: /data
      EMBEDDING_CACHE: /models
      CURATOR_TOKEN: ${CURATOR_TOKEN:?Set a strong CURATOR_TOKEN in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    volumes:
      - ./backend/storage:/data
      - ./backend/models:/models:ro
    restart: unless-stopped
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
